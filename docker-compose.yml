version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: stage-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stage_crm
      POSTGRES_USER: ${DB_USER:-stage_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stage_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stage_user} -d stage_crm"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis (queue + cache) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stage-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend FastAPI ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stage-crm-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-stage_user}:${DB_PASSWORD:-stage_password}@db:5432/stage_crm
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - user_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker (scraping + tâches async) ─────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stage-crm-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-stage_user}:${DB_PASSWORD:-stage_password}@db:5432/stage_crm
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - user_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  # ── Celery Beat (scheduler quotidien) ───────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stage-crm-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-stage_user}:${DB_PASSWORD:-stage_password}@db:5432/stage_crm
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app beat --loglevel=info

  # ── Frontend Next.js ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stage-crm-front
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
  user_uploads:
